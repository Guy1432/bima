# Builds Bima for Windows and macOS and publishes one GitHub release with both.
# Triggered by pushing a version tag (scripts/release.mjs does that):
#   npm run release -- 0.8.0 "first change · second change"
# The release stays a draft until both builds succeed, so installed apps never see half a
# release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
      notes: ${{ steps.create.outputs.notes }}
      skip: ${{ steps.create.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create draft release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # already published from a computer (npm run release -- x.y.z "..." --windows): nothing to do
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          # the tag message is the changelog: "a · b · c" → one bullet each, right-to-left
          notes=$(git tag -l --format='%(contents)' "$TAG" | sed '/^-----BEGIN PGP/,$d')
          {
            echo '<div dir="rtl">'
            echo
            echo "$notes" | sed 's/ · /\n/g' | sed '/^\s*$/d; s/^/- /'
            echo
            echo '</div>'
          } > notes.md
          # the create call returns the id directly (listing right after creating can miss a draft)
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$TAG" -f name="Bima ${TAG#v}" -F draft=true -F body=@notes.md --jq .id)
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          # one line for the in-app update prompt
          echo "notes=$(echo "$notes" | paste -sd ' ' - | sed 's/  */ /g; s/ *$//')" >> "$GITHUB_OUTPUT"

  build:
    needs: draft
    if: needs.draft.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            # one app for both Apple Silicon and Intel Macs
            args: "--target universal-apple-darwin --bundles app,dmg"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          releaseId: ${{ needs.draft.outputs.release_id }}
          releaseBody: ${{ needs.draft.outputs.notes }}
          args: ${{ matrix.args }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

  publish:
    needs: [draft, build]
    if: needs.draft.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/${{ needs.draft.outputs.release_id }}" -F draft=false -F make_latest=true
