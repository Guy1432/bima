[package]
name = "bima"
version = "0.9.2"
description = "Bima - Hebrew presentation & projection app"
edition = "2021"

[lib]
name = "bima_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
regex = "1"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# each backend only compiles on its own platform: Credential Manager / Keychain
keyring = { version = "3", features = ["windows-native", "apple-native"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
open = "5"
tokio = { version = "1", features = ["time", "sync", "fs", "io-util", "macros"] }
futures-util = "0.3.34"
# watch remote over Bluetooth LE (Windows WinRT / macOS CoreBluetooth)
btleplug = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[target.'cfg(target_os = "macos")'.dependencies]
core-text = "21"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
